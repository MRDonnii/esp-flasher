name: ESP Flasher
version: "2.1.0"
slug: esp_flasher
description: Flash egne ESP-firmwares (Zigbee-presence, Qlima Control, Tesla BLE-proxy) via USB direkte fra browseren
url: https://github.com/MRDonnii/esp-flasher
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:usb-flash-drive
panel_title: ESP Flasher
homeassistant_api: true
options:
  name: Hjemme
  wifi_ssid: ""
  wifi_password: ""
  live_firmware: true
schema:
  name: str
  wifi_ssid: str?
  wifi_password: password?
  live_firmware: bool
