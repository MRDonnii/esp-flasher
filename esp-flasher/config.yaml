name: ESP Flasher
version: "3.0.0"
slug: esp_flasher
description: Flash ESP32-firmware fra dine egne profil-kataloger via USB direkte fra browseren
url: https://github.com/MRDonnii/esp-flasher
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:usb-flash-drive
panel_title: ESP Flasher
homeassistant_api: true
options:
  name: Hjemme
  wifi_ssid: ""
  wifi_password: ""
  catalogs: []
schema:
  name: str
  wifi_ssid: str?
  wifi_password: password?
  catalogs:
    - url: str
      token: password?
