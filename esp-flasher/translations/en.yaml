configuration:
  name:
    name: Name
    description: Shown at the top of the flasher page.
  wifi_ssid:
    name: Wi-Fi name (SSID)
    description: The 2.4 GHz network new Wi-Fi devices should join. Optional.
  wifi_password:
    name: Wi-Fi password
    description: Sent to the device over USB after flashing (Improv). Kept only in Home Assistant and its backups.
  catalogs:
    name: Profile catalogs
    description: >-
      Where your firmware profiles come from. ESP Flasher ships with no firmware. url is the folder with
      catalog.json, e.g. https://github.com/OWNER/REPO/tree/main/profiles. token only for a private GitHub repo: a
      fine-grained token with only "Contents: Read-only" for that one repo. The token stays in the app and is never
      sent to the browser.
