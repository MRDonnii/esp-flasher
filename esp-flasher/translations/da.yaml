configuration:
  name:
    name: Navn
    description: Vises øverst på flasher-siden.
  wifi_ssid:
    name: Wi-Fi-navn (SSID)
    description: Det 2,4 GHz-netværk, nye Wi-Fi-enheder skal på. Valgfrit.
  wifi_password:
    name: Wi-Fi-kode
    description: Sendes til enheden over USB efter flash (Improv). Gemmes kun i Home Assistant og kommer med i dens backup.
  catalogs:
    name: Profil-kataloger
    description: >-
      Hvor dine firmware-profiler hentes fra. ESP Flasher har ingen firmware med. url er mappen med catalog.json,
      fx https://github.com/EJER/REPO/tree/main/profiles. token kun til et privat GitHub-repo: et fine-grained token
      med kun "Contents: Read-only" til netop det repo. Tokenet bliver i appen og sendes aldrig til browseren.
