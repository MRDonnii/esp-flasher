# Home Assistant app: plain HTTP on the Ingress port, only the Supervisor may connect (HA does login + HTTPS)
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types { application/javascript mjs; }
    access_log off;
    sendfile on;
    server_tokens off;
    server {
        listen 8099;
        allow 172.30.32.2;
        allow 127.0.0.1;
        deny all;
        include /app/nginx-common.inc;
    }
}
