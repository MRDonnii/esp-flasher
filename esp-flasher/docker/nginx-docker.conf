# Standalone (Docker/Unraid): HTTPS on 443 with the local CA from certs.sh
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types { application/javascript mjs; }
    access_log off;
    sendfile on;
    server_tokens off;
    server {
        listen 443 ssl;
        http2 on;
        ssl_certificate @CONF@/certs/server.crt;
        ssl_certificate_key @CONF@/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header X-Frame-Options DENY always;

        # Install this on the PC so the browser trusts the flasher (no warning page)
        location = /ca.crt {
            alias @CONF@/certs/ca.crt;
            add_header Content-Disposition 'attachment; filename="esp-flasher-ca.crt"';
        }
        include /app/nginx-common.inc;
    }
}
